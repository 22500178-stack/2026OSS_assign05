<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>러닝 기록 CRUD</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p><a href="index.html">목록으로 가기</a></p>
    <h1>나의 러닝 기록 관리</h1>

    <form id="runForm">
        <div class="form-row">
            <label for="date">날짜</label>
            <input type="date" id="date" name="date">
        </div>
        <div class="form-row">
            <label for="distance">거리 (km)</label>
            <input type="text" id="distance" name="distance" placeholder="예: 5.5">
        </div>
        <div class="form-row">
            <label for="time">시간 (분)</label>
            <input type="text" id="time" name="time" placeholder="예: 30">
        </div>
        <div class="form-row">
            <label for="note">메모</label>
            <input type="text" id="note" name="note" placeholder="예: 평봉 러닝">
        </div>

        <button type="submit" id="submitBtn">Add</button>
    </form>

    <table id="runTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>날짜</th>
                <th>거리(km)</th>
                <th>시간(분)</th>
                <th>페이스(분/km)</th>
                <th>메모</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="runTableBody">
            <!-- render()로 채워짐 -->
        </tbody>
    </table>

    <script>
        // 1.초기 데이터 설정 (날짜 포맷: YYYY-MM-DD)
        let runs = [
            { id: 1, date: "2026-09-01", distance: 5.0, time: 30, note: "평봉 달리기" },
            { id: 2, date: "2026-09-08", distance: 10.0, time: 58, note: "천마지 달리기" },
            { id: 3, date: "2026-09-15", distance: 3.2, time: 17, note: "활주로 달리기" },
        ];

        let nextId = runs.length + 1; //다음꺼는 아이디num 1씩 상승하도록

        // 2.페이스 계산 함수 (분/km)
        function calculatePace(distance, time) {
            if (!distance || distance < 0) return "-"; //입력받은 distance값이 없거나 음수인경우 "-"를 반환하도록
            return (time / distance).toFixed(2); //toFixed(n)소수점 n번쨰자리까지 반올림하여 문자열로 변환
        }

        // 3.배열의 데이터를 화면 테이블에 그려주는 함수 (Read)
        function render() {
            const tbody = document.getElementById("runTableBody"); //HTML 테이블의 내용이 들어갈 <tbody>요소를 가져옴
            tbody.innerHTML = ""; // 기존 목록(<tbody> 안의 기존 내용) 초기화

            runs.forEach(function (run) { //runs배열에 담긴 데이터 개수만큼 반복
                const tr = document.createElement("tr"); //메모리에 새로운 테이블 행(<tr>) 요소를 하나 생성
                tr.innerHTML = //생성한 행(<tr>) 안에 데이터 칸들(<td>)을 HTML 태그 형태의 문자열로 채워넣기
                    "<td>" + run.id + "</td>" + //id
                    "<td>" + run.date + "</td>" + //date
                    "<td>" + run.distance + "</td>" + //distance
                    "<td>" + run.time + "</td>" + //time
                    "<td>" + calculatePace(run.distance, run.time) + "</td>" + //pace (calculated)
                    "<td>" + run.note + "</td>" + //memo
                    "<td></td>"; // 수정/삭제 버튼은 추후 구현. 일단 지금은 빈칸
                tbody.appendChild(tr); //완성된 행(<tr>)을 실제 화면의 <tbody> 안에 자식요소로 추가
            });
        }

        // 4.페이지 로드 시 render() 자동 실행
        window.onload = function () {
            render();
        };

        // Create
        // HTML Form 요소와 버튼 가져오기
        const form = document.getElementById("runForm");
        const submitBtn = document.getElementById("submitBtn");

        // Form 제출(버튼 클릭) 이벤트 연결
        form.addEventListener("submit", function (e) {
            // 1.버튼 클릭 시 페이지가 새로고침되는 기본 동작 막기
            e.preventDefault();

            // 2.Form 입력값 읽어오기
            const date = form.date.value;
            const distance = Number(form.distance.value);
            const time = Number(form.time.value);
            const note = form.note.value;

            //유효성 검사
            // 1) 필수 항목 입력 여부 검사
            if (!date || !form.distance.value || !form.time.value) {
                alert("날짜, 거리, 시간을 모두 입력해주세요.");
                return;
            }
            // 2) 숫자 범위 검사 
            if (distance < 0 || time < 0) {
                alert("거리와 시간은 0 이상인 숫자여야 합니다.");
                return;
            }

            // 3.새로운 기록 객체 생성
            const newRun = {
                id: nextId,
                date: date,
                distance: distance,
                time: time,
                note: note,
            };

            // 4.runs 배열에 새로 만든 데이터 추가 (push)
            runs.push(newRun);
            nextId++; // 다음 기록을 위한 id +1 증가

            // 5.화면 다시 그리기 (Read 재실행)
            render();

            // 6.Form 입력창 초기화, 날짜 입력창에 포커스 
            form.reset();
            form.date.focus(); //focus(): 마우스로 특정 입력창을 직접 클릭한 것처럼 커서(짝대기)를 끠워주는 기능
        });
    </script>
</body>

</html>

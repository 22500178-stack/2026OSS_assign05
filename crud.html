<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>러닝 기록 CRUD</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p><a href="index.html">목록으로 가기</a></p>
    <h1>나의 러닝 기록 관리</h1>

    <form id="runForm">
        <div class="form-row">
            <label for="date">날짜</label>
            <input type="date" id="date" name="date">
        </div>
        <div class="form-row">
            <label for="distance">거리 (km)</label>
            <input type="text" id="distance" name="distance" placeholder="예: 5.5">
        </div>
        <div class="form-row">
            <label for="time">시간 (분)</label>
            <input type="text" id="time" name="time" placeholder="예: 30">
        </div>
        <div class="form-row">
            <label for="note">메모</label>
            <input type="text" id="note" name="note" placeholder="예: 평봉 러닝">
        </div>

        <button type="submit" id="submitBtn">Add</button>
    </form>

    <table id="runTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>날짜</th>
                <th>거리(km)</th>
                <th>시간(분)</th>
                <th>페이스(분/km)</th>
                <th>메모</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="runTableBody">
            <!-- render()로 채워짐 -->
        </tbody>
    </table>

    <script>
        // 1.초기 데이터 설정 (날짜 포맷: YYYY-MM-DD)
        let runs = [
            { id: 1, date: "2026-09-01", distance: 5.0, time: 30, note: "평봉 달리기" },
            { id: 2, date: "2026-09-08", distance: 10.0, time: 58, note: "천마지 달리기" },
            { id: 3, date: "2026-09-15", distance: 3.2, time: 17, note: "활주로 달리기" },
        ];

        let nextId = runs.length + 1; //다음꺼는 아이디num 1씩 상승하도록

        let editId = null; // (upadte)현재 수정 중인 데이터의 ID (없으면 null) 

        // 2.페이스 계산 함수 (분/km)
        function calculatePace(distance, time) {
            if (!distance || distance < 0) return "-"; //입력받은 distance값이 없거나 음수인경우 "-"를 반환하도록
            return (time / distance).toFixed(2); //toFixed(n)소수점 n번쨰자리까지 반올림하여 문자열로 변환
        }

        // 3.배열의 데이터를 화면 테이블에 그려주는 함수 (Read)
        function render() {
            const tbody = document.getElementById("runTableBody"); //HTML 테이블의 내용이 들어갈 <tbody>요소를 가져옴
            tbody.innerHTML = ""; // 기존 목록(<tbody> 안의 기존 내용) 초기화

            runs.forEach(function (run) { //runs배열에 담긴 데이터 개수만큼 반복
                const tr = document.createElement("tr"); //메모리에 새로운 테이블 행(<tr>) 요소를 하나 생성
                tr.innerHTML = //생성한 행(<tr>) 안에 데이터 칸들(<td>)을 HTML 태그 형태의 문자열로 채워넣기
                    "<td>" + run.id + "</td>" + //id
                    "<td>" + run.date + "</td>" + //date
                    "<td>" + run.distance + "</td>" + //distance
                    "<td>" + run.time + "</td>" + //time
                    "<td>" + calculatePace(run.distance, run.time) + "</td>" + //pace (calculated)
                    "<td>" + run.note + "</td>" + //memo
                    "<td>" +
                    "<button onclick='startEdit(" + run.id + ")'>수정</button> " +
                    "<button onclick='deleteRun(" + run.id + ")'>삭제</button>" +
                    "</td>";
                tbody.appendChild(tr); //완성된 행(<tr>)을 실제 화면의 <tbody> 안에 자식요소로 추가
            });
        }

        // 4.페이지 로드 시 render() 자동 실행
        window.onload = function () {
            render();
        };

        // Create
        // HTML Form 요소와 버튼 가져오기
        const form = document.getElementById("runForm");
        const submitBtn = document.getElementById("submitBtn");

        // Form 제출(버튼 클릭) 이벤트 연결
        form.addEventListener("submit", function (e) {
            // 1.버튼 클릭 시 페이지가 새로고침되는 기본 동작 막기
            e.preventDefault();

            // 2.Form 입력값 읽어오기
            const date = form.date.value;
            const distance = Number(form.distance.value);
            const time = Number(form.time.value);
            const note = form.note.value;

            //유효성 검사
            // 1) 필수 항목 입력 여부 검사
            if (!date || !form.distance.value || !form.time.value) {
                alert("날짜, 거리, 시간을 모두 입력해주세요.");
                return;
            }
            // 2) 숫자 범위 검사 
            if (distance < 0 || time < 0) {
                alert("거리와 시간은 0 이상인 숫자여야 합니다.");
                return;
            }

           // --- [유효성 검사 1, 2 통과 후] ---

        if (editId !== null) {
        // A. 수정 모드인 경우 (Update)
        // startEdit()에서 세팅한 editId와 일치하는 데이터를 찾음
        const runToUpdate = runs.find(function (run) {
            return run.id === editId;
        });

        // 해당 데이터를 찾아서 입력창의 새로운 값으로 덮어씌움 (참조 복사로 인해 runs 배열 내부 값도 변경됨)
        if (runToUpdate) {
            runToUpdate.date = date;
            runToUpdate.distance = distance;
            runToUpdate.time = time;
            runToUpdate.note = note;
        }

        // 수정이 끝났으므로 수정 상태 초기화 및 버튼 텍스트를 다시 "Add"로 복구
        editId = null;
        submitBtn.textContent = "Add";
        } else {
        // B. 일반 추가 모드인 경우 (Create)
        const newRun = {
            id: nextId,
            date: date,
            distance: distance,
            time: time,
            note: note,
        };
        runs.push(newRun);
        nextId++;
        }

        // C. 공통 작업: 변경사항 화면 갱신, 폼 비우기, 커서 이동
        render();
        form.reset();
        form.date.focus();

        });

        // Delete 기능
        function deleteRun(id) {
            // filter를 사용해 클릭한 id와 다른 데이터들만 남김 (해당 id 제거)
            runs = runs.filter(function (run) { //filter(): 원하는 조건에 맞는 아이템만 쏙쏙 골라내어 새로운 배열로 만들어주는 함수
                return run.id !== id;
            });
            // 배열이 변경되었으니 화면을 다시 그려줌 (Read 재실행)
            render();
        }

        // 수정 버튼을 눌렀을 때: 해당 데이터 정보를 Form 입력창에 채워넣는 함수
        function startEdit(id) {
            // 1. 클릭한 id에 해당하는 데이터를 runs 배열에서 찾아서 runToEdit 변수에 저장
            const runToEdit = runs.find(function (run) {
                return run.id === id; // 배열 element의 id와 전달받은 id가 같은지 비교
            });

            // 데이터가 존재하지 않을 경우 함수를 여기서 종료 (예외 처리)
            if (!runToEdit) return;

            // 2. 찾은 데이터의 각 날짜, 거리, 시간, 메모를 Form 입력창의 값으로 설정
            form.date.value = runToEdit.date;
            form.distance.value = runToEdit.distance;
            form.time.value = runToEdit.time;
            form.note.value = runToEdit.note;

            // 3. 현재 수정 중인 데이터의 id를 editId 변수에 저장 (나중에 제출할 때 어떤 데이터를 수정할지 식별하기위해
            editId = id;
            // 제출 버튼의 텍스트를 "Update"로 변경하여 수정 모드임을 표시
            submitBtn.textContent = "Update";
        }

    </script>
</body>

</html>

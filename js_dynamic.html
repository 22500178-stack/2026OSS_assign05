<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 러닝 기록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p><a href="index.html">목록으로 이동하기</a></p>
  <h1>나의 러닝 기록</h1>
  <p>오늘 뛴 거리(km)를 입력하고 추가버튼을 누르면 기록이 아래 목록에 추가됩니다.</p>

  <div class="dom-practice">
    <input type="text" id="itemInput" placeholder="예: 26/10/3 5.2km 천마지">
    <button id="addBtn">추가</button>

    <ul id="itemList"></ul>
  </div>

  <script>
    window.onload = function () {
      const input = document.getElementById("itemInput");
      const addBtn = document.querySelector("#addBtn");
      const list = document.querySelector("#itemList");

      <!--클릭을 했을 떄-->
      addBtn.addEventListener("click", function () {
        const value = input.value.trim();

        <!--내용을 입력하지 않았을 때 알림 뜨게-->
        if (value === "") {
          alert("내용을 입력하세요.");
          input.focus();
          return;
        }
      });
    };
  </script>
</body>
</html>
